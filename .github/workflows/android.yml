name: Miyar Android validation
on:
  workflow_dispatch:
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
permissions:
  contents: read
concurrency:
  group: miyar-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Test contracts, lint and compile both APK variants
        run: gradle --no-daemon --console=plain :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease
        env:
          MIYAR_ANDROID_BUILD: '1'
      - name: Save unsigned release for private local signing
        uses: actions/upload-artifact@v4
        with:
          name: Miyar-Android-Unsigned-1
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 7
      - name: Enable hardware acceleration for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run native login UI test and capture both appearances
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          working-directory: android
          script: bash scripts/emulator-check.sh
      - name: Save validation reports and actual emulator screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Miyar-Android-validation-1
          path: |
            android/app/build/reports/
            android/app/build/outputs/androidTest-results/
            android/build/verification/
          if-no-files-found: ignore
          retention-days: 7
